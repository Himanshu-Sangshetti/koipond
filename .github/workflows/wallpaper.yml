# Builds the desktop wallpaper apps. A wallpaper tag (wallpaper-v1.2.3) attaches the Mac app to a GitHub
# release. The Windows app is built as a check only until it has been tried on a real PC.
name: wallpaper
on:
  push:
    tags: ["wallpaper-v*.*.*"]
  pull_request:
    paths: ["wallpaper/**", "src/**", "tests/**", ".github/workflows/wallpaper.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - run: npm ci --ignore-scripts
        working-directory: wallpaper
      - run: npm run build:mac
        working-directory: wallpaper
        env:
          KOI_RELEASE: ${{ startsWith(github.ref, 'refs/tags/wallpaper-v') && '1' || '' }}
      # the optional pay-what-you-want store: key handling, when the card shows, and Dodo's live key check
      - name: Store checks
        working-directory: wallpaper
        run: swiftc mac/Support.swift mac/tests/main.swift -o build/support-tests && KOI_NETWORK=1 build/support-tests
      # the panel page in headless Chrome: card, "I have a key", supporter state, every button's message
      - name: Panel checks
        run: node tests/e2e/panel.mjs
      # the real app: page loads and draws, card on first open, key check reaches Dodo, installer works
      - name: App smoke test
        run: sh tests/e2e/mac-smoke.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: koipond-mac, path: wallpaper/build/koipond-mac.zip }
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with: { dotnet-version: "8.0.x" }
      - run: npm ci --ignore-scripts
        working-directory: wallpaper
      - run: npm run build:web
        working-directory: wallpaper
      - shell: pwsh
        working-directory: wallpaper
        run: |
          New-Item -ItemType Directory -Force windows/web | Out-Null
          Copy-Item build/web/*.html windows/web/
          dotnet publish windows/koipond.csproj -c Release -o build/windows
          Compress-Archive -Path build/windows/* -DestinationPath build/koipond-windows.zip
      # run the app for real: the page loads in WebView2 and keeps drawing; a screenshot is kept for review
      - name: App smoke test
        shell: pwsh
        working-directory: wallpaper
        run: |
          $out = Join-Path $env:RUNNER_TEMP "smoke.json"
          $env:KOI_SMOKE = $out
          $p = Start-Process build/windows/koipond.exe -PassThru
          Start-Sleep -Seconds 6
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save((Join-Path $env:RUNNER_TEMP "windows-desktop.png"))
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw "the app did not finish its smoke run" }
          if (-not (Test-Path $out)) { throw "the app wrote no smoke report" }
          Get-Content $out
          $r = Get-Content $out -Raw | ConvertFrom-Json
          $page = $r.page | ConvertFrom-Json
          if (-not $r.ready) { throw "the pond page never loaded" }
          if ($page.canvas -le 0) { throw "the pond has no canvas" }
          if ($page.frames -le [int]$r.framesBefore) { throw "the pond is not drawing ($($r.framesBefore) -> $($page.frames) frames)" }
          if (-not $r.layer) { Write-Warning "no desktop layer found behind the icons" }
          "ok: page loaded, drawing $($r.framesBefore) -> $($page.frames) frames, WebView2 $($r.webview), behind icons: $($r.parented)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: { name: windows-smoke, path: "${{ runner.temp }}/windows-desktop.png", if-no-files-found: ignore }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: koipond-windows, path: wallpaper/build/koipond-windows.zip }
  release:
    if: startsWith(github.ref, 'refs/tags/wallpaper-v')
    needs: [mac, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { path: dist, merge-multiple: true }
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/koipond-mac.zip \
            --repo "$GITHUB_REPOSITORY" --title "koipond wallpaper ${TAG#wallpaper-}" --latest \
            --notes "The pond as your desktop wallpaper, for macOS. Install: curl -fsSL https://raw.githubusercontent.com/Himanshu-Sangshetti/koipond/main/wallpaper/install.sh | sh"

# Builds the desktop wallpaper apps and attaches them to a GitHub release when a wallpaper tag
# (wallpaper-v1.2.3) is pushed. On pull requests and manual runs it only builds.
name: wallpaper
on:
  push:
    tags: ["wallpaper-v*.*.*"]
  pull_request:
    paths: ["wallpaper/**", "src/**", ".github/workflows/wallpaper.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - run: npm ci --ignore-scripts
        working-directory: wallpaper
      - run: npm run build:mac
        working-directory: wallpaper
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: koipond-mac, path: wallpaper/build/koipond-mac.zip }
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with: { dotnet-version: "8.0.x" }
      - run: npm ci --ignore-scripts
        working-directory: wallpaper
      - run: npx vite build
        working-directory: wallpaper
      - shell: pwsh
        working-directory: wallpaper
        run: |
          New-Item -ItemType Directory -Force windows/web | Out-Null
          Copy-Item build/web/index.html windows/web/index.html
          dotnet publish windows/koipond.csproj -c Release -o build/windows
          Compress-Archive -Path build/windows/* -DestinationPath build/koipond-windows.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: koipond-windows, path: wallpaper/build/koipond-windows.zip }
  release:
    if: startsWith(github.ref, 'refs/tags/wallpaper-v')
    needs: [mac, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { path: dist, merge-multiple: true }
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/koipond-mac.zip dist/koipond-windows.zip \
            --repo "$GITHUB_REPOSITORY" --title "koipond wallpaper ${TAG#wallpaper-}" --latest \
            --notes "The pond as your desktop wallpaper. Mac: curl -fsSL https://koipond-demo.vercel.app/install.sh | sh · Windows: irm https://koipond-demo.vercel.app/install.ps1 | iex"
